x-casaos:
  architectures:
    - amd64
  main: fatorium
  app_id: "fatorium"
  title:
    en_us: FATORIUM
    pt_br: FATORIUM
  tagline:
    en_us: "Quantitative intelligence for investments"
    pt_br: "Inteligência quantitativa para investimentos"
  description:
    en_us: "Fundamental analysis for Brazilian stocks, REITs and ETFs using public data. Free and self-hosted."
    pt_br: "Análise fundamentalista de ações, FIIs e ETFs da B3 com dados de fontes públicas. Sem custo e rodando localmente."
  icon: "https://raw.githubusercontent.com/flaviorxa/fatorium/main/app/static/logo.png"
  category: "Finance"
  port_map: "8443"
  scheme: "http"
  index: "/"
  author: "Flavio Albuquerque"
  developer: "flaviorxa"
  version: "1.0.0"
  tips:
    before_install:
      - en_us: "Optional: set INVEST_SENHA (16+ chars) in .env to require a login"
        pt_br: "Opcional: defina INVEST_SENHA (16+ caracteres) no .env para exigir login"

services:
  fatorium:
    image: ghcr.io/flaviorxa/fatorium:latest
    container_name: fatorium
    restart: unless-stopped
    ports:
      - "${FATORIUM_PORTA:-8443}:8000"
    environment:
      # opcional: com senha de 16+ caracteres o site exige HTTP Basic; vazio = aberto
      INVEST_SENHA: ${INVEST_SENHA:-}
      INVEST_USUARIO: ${INVEST_USUARIO:-invest}
      TZ: America/Sao_Paulo
    volumes:
      - fatorium-data:/app/data

volumes:
  fatorium-data:
